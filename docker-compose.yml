version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jbs-postgres
    environment:
      POSTGRES_USER: jbs_user
      POSTGRES_PASSWORD: jbs_password
      POSTGRES_DB: jbs_portal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbs_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
